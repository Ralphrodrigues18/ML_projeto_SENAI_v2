[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_olist"
version = "0.0.1"
description = "Brazilian e-commerce public dataset."
authors = [
  { name = "Ralph" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "fg-data-profiling>=4.19.1",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "seaborn>=0.13.2",
    "setuptools==81.0.0",
    "tqdm",
    "typer",
    "ydata-profiling>=4.18.4",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["module_olist"]
include = ["pyproject.toml", "module_olist/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_olist"]
force-sort-within-sections = true

